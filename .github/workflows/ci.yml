name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libasound2 libgbm1 libatk-bridge2.0-0 libxss1 libxtst6 xvfb xauth
      - run: node scripts/sync-package-version.cjs
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run test:electron
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: docs/*.png
          retention-days: 7
